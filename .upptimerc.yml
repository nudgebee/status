owner: nudgebee
repo: status
user-agent: nudgebee-status

sites:
  - name: Website
    url: https://nudgebee.com
    icon: https://nudgebee.com/favicon.ico
  - name: App
    url: https://app.nudgebee.com/status
    icon: https://app.nudgebee.com/favicon.ico
    maxResponseTime: 10000
  - name: Docs
    url: https://docs.nudgebee.com
  - name: Relay Gateway
    url: https://relay.nudgebee.com/status
    maxResponseTime: 10000
  - name: Collector Gateway
    # No public health route yet: the app answers 404 at every path, which still proves the ingress and pod are up.
    url: https://collector.nudgebee.com/
    expectedStatusCodes: [200, 404]
    maxResponseTime: 10000

status-website:
  # Repo is private: Upptime writes a bare "404" page unless publish is true
  publish: true
  # No custom domain yet; page is served at https://nudgebee.github.io/status
  # To use status.nudgebee.com: add `cname: status.nudgebee.com`, remove baseUrl, and point a CNAME at nudgebee.github.io
  baseUrl: /status
  logoUrl: https://app.nudgebee.com/logo192.png
  name: Nudgebee Status
  introTitle: "**Nudgebee** service status"
  introMessage: Live uptime and response times for the Nudgebee app, docs, and agent gateways. Incidents are tracked as issues in the [status repository](https://github.com/nudgebee/status/issues?q=label%3Astatus).
  navbar:
    - title: Status
      href: /
    - title: Docs
      href: https://docs.nudgebee.com
    - title: App
      href: https://app.nudgebee.com

assignees:
  - mayankpande88

# Notifications: add repo secrets (NOTIFICATION_SLACK=true, NOTIFICATION_SLACK_WEBHOOK=...) — no config change needed.
# See https://upptime.js.org/docs/configuration
