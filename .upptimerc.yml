owner: nudgebee
repo: status
user-agent: nudgebee-status

sites:
  # Dev environment (GKE nudgebee-dev, namespace nudgebee) for now; switch hosts to
  # app./docs./relay./collector. nudgebee.com when this page is meant to cover prod.
  - name: App
    url: https://dev.nudgebee.pollux.in/status
    icon: https://dev.nudgebee.pollux.in/favicon.ico
    maxResponseTime: 10000
  - name: Docs
    url: https://docs.dev.nudgebee.pollux.in
  # Product areas, one row each: /api/public/status?component=... answers 200 only
  # when every listed component is healthy (503 otherwise, 404 for a bad id).
  - name: App · Automation
    url: https://dev.nudgebee.pollux.in/api/public/status?component=automation
    maxResponseTime: 10000
  - name: App · Nubi
    url: https://dev.nudgebee.pollux.in/api/public/status?component=ai
    maxResponseTime: 10000
  - name: App · Troubleshooting
    url: https://dev.nudgebee.pollux.in/api/public/status?component=api,ingest
    maxResponseTime: 10000
  - name: App · Account onboarding
    url: https://dev.nudgebee.pollux.in/api/public/status?component=api,notifications
    maxResponseTime: 10000
  - name: App · Optimisation
    # Only the API server for now; cost/ML services have no health URL reachable from the app pod.
    url: https://dev.nudgebee.pollux.in/api/public/status?component=api
    maxResponseTime: 10000
  - name: Relay Gateway
    url: https://relay.dev.nudgebee.pollux.in/status
    maxResponseTime: 10000
  - name: Collector Gateway
    url: https://collector.dev.nudgebee.pollux.in/health
    maxResponseTime: 10000
  - name: LLM Gateway
    url: https://llm-gateway.dev.nudgebee.pollux.in/health
    maxResponseTime: 10000

status-website:
  # Repo is private: Upptime writes a bare "404" page unless publish is true
  publish: true
  # Custom domain: once the Cloudflare CNAME status.dev.nudgebee.com -> nudgebee.github.io
  # exists, uncomment `cname` and delete `baseUrl`. Doing it before DNS resolves makes
  # GitHub Pages redirect nudgebee.github.io/status to a dead host.
  # cname: status.dev.nudgebee.com
  baseUrl: /status
  logoUrl: https://dev.nudgebee.pollux.in/logo192.png
  # Browser-tab icon; hosted in this repo so it does not depend on the monitored host.
  favicon: https://raw.githubusercontent.com/nudgebee/status/master/assets/nudgebee-icon.png
  name: Nudgebee Status
  introTitle: "**Nudgebee** service status"
  introMessage: "Live uptime and response times for the Nudgebee dev environment (app, docs, and agent gateways). Incidents are tracked as issues in the [status repository](https://github.com/nudgebee/status/issues?q=label%3Astatus)."
  navbar:
    - title: Status
      href: /
    - title: Docs
      href: https://docs.dev.nudgebee.pollux.in
    - title: App
      href: https://dev.nudgebee.pollux.in

assignees:
  - mayankpande88

# Notifications: add repo secrets (NOTIFICATION_SLACK=true, NOTIFICATION_SLACK_WEBHOOK=...) — no config change needed.
# See https://upptime.js.org/docs/configuration
